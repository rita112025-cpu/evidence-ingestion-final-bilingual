出乾淨 Markdown 含連結、媒體與詮釋資料。Apache-2.0 ~83.4k ★，適合文件、部落格、定價頁快速結構化。",license:"Apache-2.0 • 83.4k ★",use:"爬文件站、部落格、定價頁，回傳語意化 Markdown 直接分塊。比 Firecrawl 更可自託管。",extra:["Firecrawl 對照：核心 AGPL-3.0，SDK MIT，~166k ★，雲端版為主，適合託管服務","Crawl4AI：完全開源自託管，LLM 抽取策略更細","建議：公開文件用 Crawl4AI，需託管 API 再考慮 Firecrawl"]},en:{label:"Crawl4AI",meta:"83.4k stars • web to markdown",stars:"83.4k",desc:"LLM-friendly crawler that bypasses common bot traps and outputs clean Markdown with links, media, and metadata. Apache-2.0 ~83.4k ★ for docs, blogs, pricing pages.",license:"Apache-2.0 • 83.4k ★",use:"Crawl docs, blogs, pricing. Returns semantic Markdown ready for chunking. More self-hostable than Firecrawl.",extra:["Firecrawl: AGPL-3.0 core, MIT SDK, ~166k ★, cloud-first","Crawl4AI: fully OSS self-host, finer LLM extraction","Pick Crawl4AI for open docs; Firecrawl for managed API"]}},{id:"browseruse",num:"04",zh:{label:"瀏覽器自動化",meta:"112k • Agent 自動化",stars:"112k",desc:"開源 Agent 驅動真實瀏覽器。登入、點擊、填表、無限捲動 — 靜態爬取失效時才上場。MIT ~112k ★，不要當一般 scraper 第一選擇。",license:"MIT • 112k ★",use:"處理需登入的 SPA、驗證流程、動態載入。與 Crawl4AI 搭配：靜態先行，動態補強。",extra:["定位：最後一哩的自動化，不是第一選擇","成本高、易失效，需搭配重試與可觀測性","適合：已登入儀表板、表單工作流"]},en:{label:"Browser Use",meta:"112k stars • agent automation",stars:"112k",desc:"Open-source agent that drives real browsers. Login, click, fill forms, infinite scroll — where static crawl fails. MIT ~112k ★. Don't use as first-choice scraper.",license:"MIT • 112k ★",use:"Automate authenticated flows, SPAs, infinite scroll. Pair with Crawl4AI: static first, agent for gaps.",extra:["Position: last-mile automation, not default","Higher cost / flakier, needs retries + observability","Best for: logged-in dashboards, form flows"]}},{id:"scrapy",num:"05",zh:{label:"大量爬蟲",meta:"規模化 • 生態系",stars:"52k+",desc:"大規模爬取的戰鬥測試框架。Scrapy 生態含排程、去重、儲存，搭配 Scrapling 等新選項，需釐清非爬蟲工具。",license:"BSD-3-Clause • 生態系",use:"100k+ 頁/日管線，具去重、排程與湖倉儲存。選型時避開誤解的工具。",extra:["Scrapy：BSD-3-Clause，52k ★，分散式爬取標準","Scrapling：BSD-3-Clause，現代高效能替代，相容 Scrapy 思維","AutoScraper：從範例學習規則，適合少量樣本快速建模","scrcpy：Apache-2.0 ~149.9k ★，Android 螢幕鏡射，非爬蟲框架（常見誤植）","curl-impersonate：TLS 指紋偽裝，解決指紋封鎖，非擬人行為模擬"]},en:{label:"Scrapy Stack",meta:"large scale • ecosystem",stars:"52k+",desc:"Battle-tested framework for distributed crawling. Scrapy + scheduling, dedup, storage. Includes modern options like Scrapling, but clarify non-scrapers.",license:"BSD-3-Clause • ecosystem",use:"100k+ pages/day pipelines with dedup, scheduling, lake storage. Choose correctly, avoid mislabeled tools.",extra:["Scrapy: BSD-3-Clause, 52k ★, standard for distributed crawl","Scrapling: BSD-3-Clause, modern high-performance alternative","AutoScraper: learns rules from sample pages, quick for small sites","scrcpy: Apache-2.0 ~149.9k ★, Android screen mirroring, NOT a scraping framework","curl-impersonate: TLS fingerprint impersonation, fixes fingerprint blocks, not human-behavior simulation"]}},{id:"evidence",num:"06",zh:{label:"證據鏈",meta:"結構 • 工作流",stars:"core",desc:"我們的層：Zod schemas、來源追溯、引用錨定、審閱 UI。把原始 Markdown 轉成可驗證證據，產出稽核軌跡。",license:"MIT • internal",use:"定義什麼算證據。驗證、連結來源、產出稽核報告。與前面工具串成端到端。",extra:["Schema：用 Zod 定義證據結構","Provenance：每次擷取保留 URL / 檔案雜湊 / 時間","Review：人審 UI 標示不確定段落"]},en:{label:"Evidence",meta:"schema & workflow",stars:"core",desc:"Our layer: Zod schemas, provenance tracking, citation anchoring, and review UI. Turns raw Markdown into verifiable evidence with audit trails.",license:"MIT • internal",use:"Define what counts as evidence. Validate, link sources, ship audit trails. Glue for the stack.",extra:["Schema: Zod-defined evidence shapes","Provenance: URL / file hash / timestamp per capture","Review: UI to flag uncertain spans"]}}],wm={zh:{top:"edh / 2026",welcome:"歡迎來到",line1:"證據優先",line2:"擷取系統",suffix:"工程文件堆疊",heroDesc1:"一座會動的工具城市，把混亂的文件、狂野網頁與無頭瀏覽器，轉成",heroDescBold:"可驗證、符合 schema 的證據",heroDesc2:"。沒有膠水地獄。",badges:["文件 → md","網頁 → md","代理 → 行動","規模 → 湖倉"],back:"返回",backMenu:"返回選單",useCase:"使用情境",details:"詳細",overview:"總覽",manifesto:"宣言",close:"關閉",est:"EST.
